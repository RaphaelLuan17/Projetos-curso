<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portas das Avaliações PRO</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }
  
  body{
    font-family:'Poppins', sans-serif;
    background:linear-gradient(135deg,#0f172a,#111827);
    min-height:100vh;
    color:white;
    overflow-x:hidden;
    transition:0.4s;
  }
  

/* NAVBAR */

header{
  position:sticky;
  top:0;
  z-index:1000;

  display:flex;
  justify-content:space-between;
  align-items:center;

  width:100%;
  padding:18px 8%;

  background:rgba(15,23,42,0.75);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border-bottom:1px solid rgba(255,255,255,0.05);

  box-shadow:0 8px 25px rgba(0,0,0,0.25);

  transition:0.3s ease;
}

/* LOGO */

.logo{
  font-size:24px;
  font-weight:700;
  color:#2563eb;
  letter-spacing:1px;
}

.logo span{
  color:#1d4ed8;
}

/* MENU */

nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
}

nav a{
  margin-left:25px;
  text-decoration:none;
  color:#2563eb;
  font-weight:500;
  position:relative;
  transition:0.3s ease;
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-5px;

  width:0;
  height:2px;

  background:#2563eb;
  transition:0.3s ease;
}

nav a:hover::after{
  width:100%;
}

nav a:hover{
  color:#1d4ed8;
}

/* BOTÃO TEMA */

.theme-btn{
  border:none;

  background:linear-gradient(135deg,#2563eb,#1d4ed8);

  color:white;
  width:45px;
  height:45px;

  border-radius:50%;
  font-size:20px;

  cursor:pointer;
  transition:0.3s;

  box-shadow:0 5px 15px rgba(37,99,235,0.35);
}

.theme-btn:hover{
  transform:scale(1.1);
}

/* DARK MODE */

body.light header{
  background:rgba(255,255,255,0.85);
}

body.light nav a{
  color:#2563eb;
}

body.light nav a::after{
  background:#2563eb;
}

body.light .logo{
  color:#2563eb;
}
/* BOTÃO TEMA */

.theme-btn{
  border:none;

  background:linear-gradient(135deg,#2563eb,#1d4ed8);

  color:white;
  width:45px;
  height:45px;

  border-radius:50%;
  font-size:20px;

  cursor:pointer;
  transition:0.3s;

  box-shadow:0 5px 15px rgba(37,99,235,0.35);
}

.theme-btn:hover{
  transform:scale(1.1);
}
  
  /* CARD PRINCIPAL */
  
  .main-box{
    width:100%;
    min-height:85vh;
  
    display:flex;
    justify-content:center;
    align-items:center;
  
    padding:40px 20px;
  }
  
  .card-avaliacao{
    width:100%;
    max-width:650px;
  
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
  
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
  
    padding:40px;
  
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
  
    animation:fade 1s ease;
    transition:0.4s;
  }
  
  @keyframes fade{
    from{
      opacity:0;
      transform:translateY(30px);
    }
  
    to{
      opacity:1;
      transform:translateY(0);
    }
  }
  
  /* TOPO */
  
  .topo{
    margin-bottom:30px;
  }
  
  .topo h1{
    font-size:40px;
    font-weight:700;
  }
  
  .topo p{
    color:#cbd5e1;
    margin-top:10px;
  }
  
  /* ÍCONE */
  
  .juiz-box{
    font-size:90px;
    margin-bottom:15px;
    transition:0.4s;
  }
  
  /* MENSAGEM */
  
  #juizMsg{
    font-size:22px;
    font-weight:500;
    margin-bottom:25px;
  }
  
  /* ESTRELAS */
  
  .stars{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:35px;
  }
  
  .stars span{
    font-size:55px;
    cursor:pointer;
    color:#475569;
    transition:0.3s;
  }
  
  .stars span:hover{
    transform:translateY(-8px) scale(1.1);
  }
  
  .stars span.active{
    color:#facc15;
    text-shadow:0 0 15px rgba(250,204,21,0.8);
  }
  
  /* BOTÃO */
  
  .btn-finalizar{
    background:linear-gradient(135deg,#22c55e,#16a34a);
  
    border:none;
    color:white;
  
    padding:15px 35px;
    border-radius:15px;
  
    font-size:18px;
    font-weight:600;
  
    cursor:pointer;
    transition:0.3s;
  
    box-shadow:0 5px 20px rgba(34,197,94,0.4);
  }
  
  .btn-finalizar:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 30px rgba(34,197,94,0.5);
  }
  
  /* MÉDIA */
  
  .media-box{
    margin-top:35px;
  
    padding:20px;
    border-radius:18px;
  
    background:rgba(255,255,255,0.05);
  }
  
  .media-box h3{
    font-size:22px;
  }
  
  #media{
    color:#facc15;
    font-size:28px;
    font-weight:700;
  }
  
  /* FOOTER */
  
  footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
  }
  
  /* CANVAS */
  
  canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
  }
  
  /* LIGHT MODE */
  
  body.light{
    background:linear-gradient(135deg,#f8fafc,#e2e8f0);
    color:#0f172a;
  }
  
  body.light header{
    background:rgba(255,255,255,0.75);
    border-bottom:1px solid rgba(0,0,0,0.05);
  }
  
  body.light nav a{
    color:#2563eb;
  }
  
  body.light nav a::after{
    background:#2563eb;
  }
  
  body.light nav a:hover{
    color:#2563eb;
  }
  
  body.light .card-avaliacao{
    background:white;
    border:none;
  }
  
  body.light .topo p{
    color:#475569;
  }
  
  body.light .media-box{
    background:#f1f5f9;
  }
  
  body.light footer{
    color:#475569;
  }
  
  /* RESPONSIVO */
  
  @media(max-width:768px){
  
    header{
      flex-direction:column;
      gap:12px;
    }
  
    nav a{
      margin:5px 10px;
    }
  
    .card-avaliacao{
      padding:30px 20px;
    }
  
    .topo h1{
      font-size:30px;
    }
  
    .stars span{
      font-size:45px;
    }
  
  }
  
  </style>
</head>

<body>

<header>

  <div class="logo">StudyLink</div>
  
  <nav>
      <a href="index.html">Início</a>
      <a href="forum.html">Fórum</a>
      <a href="materiais.html">Matérias</a>
      <a href="mentoria.html">Mentoria</a>
      <a href="mentoria.html">Missão</a>
      <a id="loginLink" href="login.html">Perfil</a>
    </nav>

  <button class="theme-btn" onclick="toggleTheme()">
    🌙
  </button>

</header>

<section class="main-box">

  <div class="card-avaliacao">

    <div class="topo">
      <h1>Deixe sua Avaliação</h1>
      <p>
        Sua opinião é muito importante para melhorarmos
        nossos serviços e experiências.
      </p>
    </div>

    <h4 id="juizMsg">
      Aguardando sua avaliação...
    </h4>

    <div class="stars">

      <span onclick="avaliar(1)">★</span>
      <span onclick="avaliar(2)">★</span>
      <span onclick="avaliar(3)">★</span>
      <span onclick="avaliar(4)">★</span>
      <span onclick="avaliar(5)">★</span>

    </div>

    <button class="btn-finalizar" onclick="finalizar()">
      Finalizar Avaliação
    </button>

    <div class="media-box">

      <h3>
        Média Geral
      </h3>

      <div>
        ⭐ <span id="media">0.0</span>
      </div>

    </div>

  </div>

</section>

<footer>
  <p>StudyLink • Plataforma colaborativa de estudos</p>
  </footer>
<!------------------------------------------------------------------------------------------------------------------->
<!-- SOM -->
<audio id="golSom"
src="https://www.soundjay.com/human/sounds/applause-8.mp3">
</audio>

<!-- CONFETE -->
<canvas id="efeitos"></canvas>

<script>

/* TEMA */

function toggleTheme(){
  document.body.classList.toggle("light");
}

/* AVALIAÇÃO */

let notaAtual = 0;

function avaliar(nota){

  notaAtual = nota;

  document.querySelectorAll(".stars span")
  .forEach((s, i) => {

    s.classList.toggle("active", i < nota);

  });

  const msg = document.getElementById("juizMsg");
  const icon = document.getElementById("juizIcon");

  if(nota <= 2){

    msg.innerText = "Sentimos muito pela experiência 😢";
    icon.innerText = "😔";

  }

  else if(nota === 3){

    msg.innerText = "Obrigado pela avaliação 🙂";
    icon.innerText = "😊";

  }

  else{

    msg.innerText = "Excelente! Ficamos felizes 😍";
    icon.innerText = "🚀";

  }

}

/* LOCAL STORAGE */

function salvarNota(nota){

  let notas =
    JSON.parse(localStorage.getItem("notas")) || [];

  notas.push(nota);

  localStorage.setItem(
    "notas",
    JSON.stringify(notas)
  );

  atualizarMedia();

}

function atualizarMedia(){

  let notas =
    JSON.parse(localStorage.getItem("notas")) || [];

  if(notas.length === 0) return;

  let media =
    notas.reduce((a,b)=>a+b,0) / notas.length;

  document.getElementById("media")
  .innerText = media.toFixed(1);

}

/* CONFETE */

const canvas =
document.getElementById("efeitos");

const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetes = [];
let animando = false;

function criarConfete(){

  const cores = [
    "#22c55e",
    "#3b82f6",
    "#facc15",
    "#ef4444",
    "#ffffff"
  ];

  return{

    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,

    size:Math.random()*6+4,

    speedX:Math.random()*2-1,

    speedY:Math.random()*3+2,

    color:cores[
      Math.floor(
        Math.random()*cores.length
      )
    ]

  };

}

function animarConfete(){

  if(!animando) return;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  confetes.forEach(c => {

    ctx.beginPath();

    ctx.arc(
      c.x,
      c.y,
      c.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle = c.color;

    ctx.fill();

    c.x += c.speedX;
    c.y += c.speedY;

    if(c.y > canvas.height){
      c.y = -10;
    }

  });

  requestAnimationFrame(animarConfete);

}

function iniciarConfete(duracao = 3000){

  confetes = [];

  for(let i=0;i<250;i++){

    confetes.push(criarConfete());

  }

  animando = true;

  animarConfete();

  setTimeout(() => {

    animando = false;

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }, duracao);

}

/* FINALIZAR */

function finalizar(){

  if(notaAtual === 0){

    alert("Escolha uma nota!");

    return;

  }

  salvarNota(notaAtual);

  document.getElementById("golSom").play();

  iniciarConfete();

  document.getElementById("juizMsg")
  .innerText =
  "Avaliação enviada com sucesso 🎉";

}

/* RESPONSIVO */

window.addEventListener("resize", ()=>{

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

});

/* INICIAR */

window.onload = () => {

  atualizarMedia();

};

</script>

</body>
</html>
